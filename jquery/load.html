<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(function() {
            $('#btn_click').on('click', function() {
                $('#display').load('./outer.html1', function(responseText, statusText, xhr){
                    if(statusText == 'error'){
                    //alert('에러')
                    alert('Error:' + xhr.status + ':' + xhr.statusText)
                    }
                    alert(statusText);
                })
            })
        })
    </script>
</head>
<body>
    <button id="btn_click">클릭해보세요</button>
    <div id="display"></div>
</body>
</html>
